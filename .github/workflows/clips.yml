name: Clips virales

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub puede retrasarlo en horas punta)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/**", "requirements.txt"]

permissions:
  contents: write
  issues: write

concurrency:
  group: clipodromo
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt

      - name: Caché del modelo de subtítulos
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Buscar y publicar clips cada 5 minutos (durante 3 horas)
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "clipodromo-bot"
          git config user.email "clipodromo-bot@users.noreply.github.com"
          subir() { git add -A clips state; git diff --cached --quiet || (git commit -q -m "$1" && git pull -q --rebase && git push -q) || true; }
          fin=$(( $(date +%s) + 3*3600 ))
          while [ $(date +%s) -lt $fin ]; do
            inicio=$(date +%s)
            git pull -q --rebase || true
            python bot/main.py detectar || echo "fallo detectando"
            subir "Clips $(date -u +%H:%M)"
            sleep 20
            python bot/main.py publicar || echo "fallo publicando"
            python bot/main.py diagnostico || echo "fallo diagnostico"
            subir "Estado $(date -u +%H:%M)"
            espera=$(( 300 - ($(date +%s) - inicio) ))
            [ $espera -gt 0 ] && sleep $espera
          done
