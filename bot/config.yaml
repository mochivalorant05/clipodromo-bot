# Se publica de todo MENOS apuestas y casinos.
# Un clip se descarta si su categoría o su título contiene alguna de estas palabras.
palabras_excluidas:
  - slots
  - casino
  - poker
  - blackjack
  - roulette
  - ruleta
  - apuesta
  - apostar
  - gambling
  - betting
  - stake
  - tragaperras

# Detección de clips virales (rev. 4: pocos clips, solo los mejores, en cuanto pasan)
# Se mide el "momento": la suma de visitas de todos los clips del mismo instante del directo.
# Calibrado con 4 días de datos: >=200 visitas en <=20 min salen ~2-5 momentos al día.
deteccion:
  ventana_minutos: 30          # solo se miran clips creados en la última media hora
  edad_max_min: 20             # el momento tiene que llegar al listón en sus primeros 20 min
  vistas_minimas: 200          # listón: visitas del momento para merecer subida
  vistas_excepcional: 500      # bombazo: puede saltarse la separación normal entre vídeos
  cluster_minimo: 2            # (informativo) nº de clips del mismo momento
  cluster_segundos: 60         # cuánto pueden separarse en el directo para contar como el mismo momento
  max_por_ejecucion: 1         # se edita como mucho 1 clip por pasada (el mejor)

# Cupo diario común a las tres redes: solo los mejores
cupo:
  max_dia: 3                   # vídeos como máximo en 24 h
  max_por_streamer: 2          # para no llenar el perfil de un solo streamer
  horas_entre: 2               # separación normal entre vídeos
  horas_entre_excepcional: 0.75  # separación mínima si el clip es un bombazo

# Aprobación manual desactivada: todos los clips se publican automáticamente
aprobaciones_manuales: 0

# Edición
edicion:
  subtitulos: true             # transcripción automática en español (faster-whisper)
  modelo_whisper: small
  marca: "@elclipodromo"

# Publicación en Buffer (organización "El Clipódromo"). Se rellenan cuando estén conectados los canales.
buffer:
  canales:
    tiktok: "6af4d5a262b70b94b0fb9b6e"
    instagram: "6af4d92062b70b94b0fbf9d1"
    youtube: "6af4d61062b70b94b0fb9e9c"
  # límites por red para no parecer un bot (TikTok y YouTube bloquean si se publica demasiado)
  limites:
    tiktok:    {max_dia: 3, horas_entre: 2, pausa_hasta: "2026-11-18T08:00:00+00:00"}   # pausa por el aviso de TikTok del 14/11
    instagram: {max_dia: 3, horas_entre: 0.75}
    youtube:   {max_dia: 3, horas_entre: 0.75}
  hashtags: "#clips #twitch #streamer #parati #fyp #viral"

